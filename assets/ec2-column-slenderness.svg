<text x="640" y="130" font-size="12" font-weight="600" fill="#c0392b">M_Ed = 88.7 kNm</text>

<line x1="710" y1="305" x2="726" y2="305" stroke="#1f4e5f" stroke-width="1"/>
<text x="730" y="309" font-size="11" fill="#1f4e5f">M0e = 55.0</text>
<line x1="710" y1="215" x2="726" y2="215" stroke="#6d9bb0" stroke-width="1"/>
<text x="730" y="219" font-size="11" fill="#3f6b80">M_i = 11.9</text>
<line x1="710" y1="169" x2="726" y2="169" stroke="#c0392b" stroke-width="1"/>
<text x="730" y="173" font-size="11" fill="#c0392b">M2 = 21.8</text>

