<text x="414" y="160" font-size="10" fill="#c0392b" text-anchor="middle">d′</text>
<line x1="400" y1="215" x2="575" y2="215" stroke="#999" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="580" y="219" font-size="10" fill="#666">bending</text>
<text x="580" y="231" font-size="10" fill="#666">axis</text>

<text x="400" y="322" font-size="11" fill="#333">N_Ed = 1 500 kN</text>
<text x="400" y="338" font-size="11" fill="#333">M_Ed = 88.7 kNm</text>
