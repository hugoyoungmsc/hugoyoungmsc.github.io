<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="slTitle slDesc">
<title id="slTitle">EC2 §5.8 slender column — effective length, section and second-order moment build-up</title>
<desc id="slDesc">Braced column 300 by 300 mm, clear height 3900 mm, effective length 3169 mm, slenderness 36.6 against a limit of 22.2. Moment build-up at mid-height: first-order 55.0 kNm plus imperfection 11.9 kNm plus second-order 21.8 kNm gives 88.7 kNm against a resistance of 102.5 kNm.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- ================= Panel A: elevation ================= -->
<text x="130" y="40" font-size="15" font-weight="600" fill="#222">Column elevation</text>

<rect x="130" y="80" width="60" height="300" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>

<line x1="112" y1="80" x2="112" y2="380" stroke="#666" stroke-width="1"/>
<line x1="108" y1="80" x2="116" y2="80" stroke="#666" stroke-width="1"/>
<line x1="108" y1="380" x2="116" y2="380" stroke="#666" stroke-width="1"/>
<text x="104" y="234" font-size="11" fill="#666" text-anchor="end" transform="rotate(-90 104 234)">l = 3 900 mm</text>

<line x1="215" y1="108.1" x2="215" y2="351.9" stroke="#1f4e5f" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="211" y1="108.1" x2="219" y2="108.1" stroke="#1f4e5f" stroke-width="1.2"/>
<line x1="211" y1="351.9" x2="219" y2="351.9" stroke="#1f4e5f" stroke-width="1.2"/>
<text x="224" y="234" font-size="11" fill="#1f4e5f" transform="rotate(-90 224 234)">l0 = 3 169 mm</text>

<path d="M 160 80 C 195 155 195 305 160 380" fill="none" stroke="#c0392b" stroke-width="2"/>
<line x1="124" y1="230" x2="232" y2="230" stroke="#999" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="160" y1="230" x2="186" y2="230" stroke="#c0392b" stroke-width="1"/>
<rect x="175" y="233" width="8" height="0" fill="none"/>

<path d="M 120 72 A 32 32 0 0 1 190 72" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="160" y="56" font-size="11" fill="#333" text-anchor="middle">M01 = 40 kNm</text>
<path d="M 120 388 A 32 32 0 0 0 190 388" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="160" y="408" font-size="11" fill="#333" text-anchor="middle">M02 = 65 kNm</text>

<text x="196" y="222" font-size="11" fill="#c0392b">deflected</text>
<text x="196" y="236" font-size="11" fill="#c0392b">shape</text>
<text x="130" y="436" font-size="11" fill="#666">λ = 36.6 &gt; λ_lim = 22.2 — slender</text>

<!-- ================= Panel B: section ================= -->
<text x="400" y="40" font-size="15" font-weight="600" fill="#222">Section 300 × 300, 4H25</text>

<rect x="400" y="140" width="150" height="150" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
<line x1="338" y1="140" x2="562" y2="140" stroke="#333" stroke-width="0.8"/>
<path d="M 338 140 L 330 136 L 330 144 Z" fill="#333"/>
<path d="M 562 140 L 570 136 L 570 144 Z" fill="#333"/>
<text x="450" y="132" font-size="11" fill="#333" text-anchor="middle">300</text>
